name: Desplegar en GitHub Pages

on:
  # Se publica automáticamente con cada push a main
  push:
    branches: [main]
  # Y también se puede lanzar a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez; no cancela uno que ya esté en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir la carpeta public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
