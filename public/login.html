<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | CeutaPlay</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">CEUTA<span>PLAY</span></a>
            <a href="index.html" class="login-btn">Volver al inicio</a>
        </div>
    </header>

    <main class="login-page">
        <section class="login-panel" aria-labelledby="login-title">
            <h1 id="login-title">Iniciar sesión</h1>
            <p id="login-help">Entra con tu cuenta para reservar pistas y participar en las subastas.</p>

            <form id="login-form" class="login-form" aria-describedby="login-help">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" autocomplete="email" placeholder="jugador@ejemplo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" autocomplete="current-password" required>

                <label class="login-remember">
                    <input type="checkbox" id="remember"> Recordarme en este navegador
                </label>

                <button type="submit" class="register-btn">Entrar</button>
            </form>

            <p id="login-status" role="status"></p>
            <p>¿Todavía no tienes cuenta? <a href="registro.html">Registrarse</a></p>
            <div class="demo-box">
                <strong>Cuentas de prueba</strong> (contraseña <code>demo1234</code>):<br>
                ana@ceutaplay.es · luis@ceutaplay.es · marta@ceutaplay.es
            </div>
            <noscript><p>Activa JavaScript para probar el formulario.</p></noscript>
        </section>
    </main>
</body>
</html>
