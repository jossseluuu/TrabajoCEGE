<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | CeutaPlay</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/login.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">CEUTA<span>PLAY</span></a>
            <a href="index.html" class="login-btn">Volver al inicio</a>
        </div>
    </header>

    <main class="login-page">
        <section class="login-panel" aria-labelledby="login-title">
            <h1 id="login-title">Registrarse</h1>
            <p id="login-help">Modo demostración. Usa datos ficticios. El nombre y el correo se guardan en este navegador.</p>

            <form id="login-form" class="login-form" aria-describedby="login-help">
                <label for="registration-name">Nombre visible</label>
                <input id="registration-name" autocomplete="nickname" maxlength="60" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" autocomplete="off" placeholder="jugador@ejemplo.com" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" autocomplete="off" required>

                <button type="submit" class="register-btn">Probar registro</button>
            </form>

            <p id="login-status" role="status"></p>
            <p>¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
            <noscript><p>Activa JavaScript para probar el formulario.</p></noscript>
        </section>
    </main>
</body>
</html>
