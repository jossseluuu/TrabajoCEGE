<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | CeutaPlay</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%BE%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/tema.js"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/nav.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    
    <!-- Cabecera común: la dibuja js/nav.js -->
    <header class="navbar" id="site-header" data-pagina="registro"></header>

    <main class="login-page">
        <section class="login-panel" aria-labelledby="login-title">
            <h1 id="login-title">Registrarse</h1>
            <p id="login-help">Crea tu cuenta para reservar pistas y participar en las subastas.</p>

            <form id="login-form" class="login-form" aria-describedby="login-help">
                <label for="registration-name">Nombre visible</label>
                <input id="registration-name" autocomplete="nickname" minlength="2" maxlength="40" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" autocomplete="email" placeholder="jugador@ejemplo.com" required>

                <label for="password">Contraseña (mínimo 8 caracteres, con letras y números)</label>
                <input type="password" id="password" autocomplete="new-password" minlength="8" required>

                <label for="password2">Repite la contraseña</label>
                <input type="password" id="password2" autocomplete="new-password" minlength="8" required>

                <p class="form-hint legal-accept">Al crear la cuenta aceptas las <a href="legal.html#condiciones" target="_blank">condiciones de uso</a> y la <a href="legal.html#privacidad" target="_blank">política de privacidad</a>.</p>
                <button type="submit" class="register-btn">Crear cuenta</button>
            </form>

            <p id="login-status" role="status"></p>
            <p>¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
            <noscript><p>Activa JavaScript para probar el formulario.</p></noscript>
        </section>
    </main>
</body>
</html>
